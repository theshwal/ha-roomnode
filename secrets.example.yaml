# Fichier d'EXEMPLE — NE PAS COMMITTER LES VRAIES VALEURS.
#
# Copier ce fichier en `secrets.yaml` (déjà ignoré par .gitignore) et
# compléter avec les valeurs réelles de l'installation.
#
#   cp secrets.example.yaml secrets.yaml
#
# Clé de chiffrement API ESPHome (32 octets, base64) :
#   esphome encrypt "ma-cle-de-32-octets-pour-l-api"
#
# Les secrets Wi-Fi sont ceux du réseau local de la pièce.

wifi_ssid: "CHANGE_ME_WIFI_SSID"
wifi_password: "CHANGE_ME_WIFI_PASSWORD"

# Mot de passe du point d'accès de secours (>= 8 caractères).
wifi_ap_password: "CHANGE_ME_AP_PASSWORD"

# Mot de passe OTA (protège l'installation des mises à jour).
ota_password: "CHANGE_ME_OTA_PASSWORD"

# Clé de chiffrement de l'API ESPHome (base64, 32 octets).
api_encryption_key: "CHANGE_ME_BASE64_32_BYTE_KEY"
