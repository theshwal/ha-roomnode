# HA RoomNode — socle commun (package ESPHome)
#
# Cible V1 : Waveshare ESP32-S3-Touch-LCD-4.3C
# Réf.    : https://docs.waveshare.com/ESP32-S3-Touch-LCD-4.3C
#           https://github.com/waveshareteam/ESP32-S3-Touch-LCD-4.3C
#
# Ce package ne contient que la plateforme, la connectivité et l'OTA.
# Il est partage par tous les profils de la cible V1.
#
# PARAMETRAGE PAR INSTANCE (issue #5) : le nom du noeud et le nom lisible
# viennent des `substitutions`, fournies par le fichier d'instance include
# par le profil. Sans ce fichier, les valeurs de repli ci-dessous
# s'appliquent : le profil reste donc utilisable tel quel.
#
# Secrets : ce dépôt ne contient AUCUN secret. Fournir le fichier de secrets
# local (voir secrets.example.yaml). Les secrets sont resolus par rapport
# au fichier qui les declare : ils sont donc declares ici.

substitutions:
  node_name: roomnode
  node_friendly_name: RoomNode
  ha_zone: ""
  room_label: ""

esphome:
  name: ${node_name}
  friendly_name: ${node_friendly_name}
  comment: "HA RoomNode — Waveshare ESP32-S3-Touch-LCD-4.3C"

esp32:
  board: esp32-s3-devkitc1-n16r8
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
  flash_size: 16MB

# PSRAM 8 Mo octal : obligatoire pour le tampon d'affichage 800x480.
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    # Le SSID du point d'acces de secours est derive du nom du noeud
    # (substitution `node_name`), afin que deux noeuds voisins n'emettent
    # pas le meme SSID et restent distinguables au provisionnement.
    # Le mot de passe reste un secret local.
    ssid: "${node_name}-Setup"
    password: !secret wifi_ap_password

captive_portal:
