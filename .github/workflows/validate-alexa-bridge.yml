name: Validate Alexa bridge samples

on:
  push:
    paths:
      - "homeassistant/**"
      - "esphome/examples/**"
      - "tests/**"
      - ".github/workflows/validate-alexa-bridge.yml"
  pull_request:
    paths:
      - "homeassistant/**"
      - "esphome/examples/**"
      - "tests/**"
      - ".github/workflows/validate-alexa-bridge.yml"

permissions:
  contents: read

jobs:
  check-alexa-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install "PyYAML==6.0.3" "Jinja2==3.1.6"
      - name: Run static bridge tests
        run: python -m unittest discover -s tests -v
