name: Validate ESPHome firmware configs

# Cette CI valide le SCHEMA des configurations ESPHome (esphome config).
# Elle ne compile PAS le firmware : les preuves de compilation sont locales
# (voir docs/validation.md). Une job de compilation serait ajoutee ulterieurement.

on:
  push:
    paths:
      - "firmware/**"
      - "scripts/**"
      - "secrets.example.yaml"
      - ".github/workflows/validate-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "scripts/**"
      - "secrets.example.yaml"
      - ".github/workflows/validate-firmware.yml"

permissions:
  contents: read

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install "esphome==2026.10.1"
      - name: Validate configs (fictitious secrets, schema only)
        run: scripts/validate.sh
