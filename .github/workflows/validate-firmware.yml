name: Validate ESPHome firmware configs

on:
  push:
    paths:
      - "firmware/**"
      - "scripts/**"
      - "secrets.example.yaml"
      - ".github/workflows/validate-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "scripts/**"
      - "secrets.example.yaml"
      - ".github/workflows/validate-firmware.yml"

permissions:
  contents: read

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install "esphome==2026.10.1"
      - name: Validate configs (fictitious secrets)
        run: scripts/validate.sh
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esphome-validation-log
          path: /tmp/roomnode-esphome-build/
          if-no-files-found: ignore
